name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Lint
        run: ruff check --select E4,E7,E9,F --ignore E402 src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run smoke experiment
        run: python src/run_sweep_experiments_v2.py --mode smoke --output-dir "${RUNNER_TEMP}/gnn-smoke"

      - name: Audit declared runtime dependencies
        run: pip-audit -r requirements.txt

      - name: Audit complete installed environment
        run: pip-audit
